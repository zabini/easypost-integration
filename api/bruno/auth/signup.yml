info:
  name: Sign Up
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3031/auth/signup
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: X-Requested-With
      value: XMLHttpRequest
  body:
    type: json
    data: |+
      {
        "name": "Jane Doe",
        "email": "{{$randomEmail}}",
        "password": "12345678",
        "password_confirmation": "12345678"
        
      }

  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: after-response
      code: |-
        const accessToken = res.body?.meta?.access_token;
        if (accessToken) {
          bru.setEnvVar('access_token', accessToken);
        }

docs: |-
  Cria um novo usuario e retorna os dados publicos + Bearer token.

  ## Regras
  - `name`: obrigatorio
  - `email`: obrigatorio e valido
  - `password`: obrigatorio, minimo de 8 caracteres e com confirmacao

  ## Sucesso
  `201 Created`

  ```json
  {
    "data": {
      "id": 1,
      "name": "Jane Doe",
      "email": "jane@example.com"
    },
    "meta": {
      "access_token": "token...",
      "token_type": "Bearer"
    }
  }
  ```

  ## Erros comuns
  - `422 Unprocessable Entity`: payload invalido
  - `422 Unprocessable Entity`: email ja cadastrado
