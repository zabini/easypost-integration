info:
  name: Auth
  type: folder
  seq: 2

request:
  scripts:
    - type: before-request
      code: |-
        const accessToken = bru.getEnvVar('access_token');

        if (accessToken) {
          req.headers.Authorization = `Bearer ${accessToken}`;
        }

docs:
  content: |-
    Endpoints de autenticacao com Sanctum via Bearer token.

    ## Fluxo esperado
    1. `POST /auth/signup` ou `POST /auth/login`
    2. salvar `meta.access_token` em `access_token`
    3. `GET /auth/me` para recuperar o usuario autenticado
    4. `POST /auth/logout` para revogar o token atual
  type: text/markdown
